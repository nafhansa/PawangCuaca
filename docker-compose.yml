services:
  db:
    image: postgres:16-alpine
    container_name: pawangcuaca_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pawangcuaca_db
      POSTGRES_USER: pawangcuaca_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pawangcuaca_secure_2026}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawangcuaca_user -d pawangcuaca_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pawangcuaca-internal
      - pawangcuaca-external

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pawangcuaca_server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3004
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-https://pawangcuaca.space}
      DATABASE_URL: postgresql://pawangcuaca_user:${DB_PASSWORD:-pawangcuaca_secure_2026}@db:5432/pawangcuaca_db
      DB_POOL_MIN: 2
      DB_POOL_MAX: 10
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_very_long_random_string}
      JWT_EXPIRES_IN: 24h
      CACHE_TTL_SECONDS: 600
      TRUSTED_PROXIES: 1
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      LOG_LEVEL: info
      UPLOAD_DIR: uploads
      MAX_IMAGE_SIZE_MB: 10
      MAX_VIDEO_SIZE_MB: 50
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pawangcuaca-internal
      - pawangcuaca-external

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${CLIENT_API_URL:-https://pawangcuaca.space/api}
        VITE_APP_VERSION: "1.0.0"
    container_name: pawangcuaca_client
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - pawangcuaca-external

  nginx:
    image: nginx:alpine
    container_name: pawangcuaca_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/pawangcuaca-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - server
    networks:
      - pawangcuaca-external

networks:
  pawangcuaca-internal:
    driver: bridge
    internal: true
  pawangcuaca-external:
    driver: bridge

volumes:
  pgdata:
  uploads:
